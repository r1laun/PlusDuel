[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Game API → single Function (must come before the SPA fallback).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: all routes serve index.html (client handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed Vite assets: immutable long cache. index.html is never cached
# (Netlify default) so new deploys are picked up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
