name = "plusduel-game"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
# NOTE: new_classes (legacy backend) instead of new_sqlite_classes —
# local miniflare is flaky with SQLite alarms (canceled deliveries +
# "internal error" on storage.put from alarm()). Revisit on wrangler upgrade.
new_classes = ["LobbyDO", "RoomDO"]
